services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thermo
    command: postgres -c work_mem=256MB -c maintenance_work_mem=1GB -c max_wal_size=4GB
    ports:
      - "5433:5432"   # psql -h localhost -p 5433 -U postgres thermo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thermo"]
      interval: 2s
      retries: 30

  pipeline:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/thermo
    volumes:
      - ./results:/app/results
      - ./figures:/app/figures
